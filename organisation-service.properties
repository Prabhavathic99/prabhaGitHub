spring.datasource.url=jdbc:mysql://localhost:3306/organisation_db
spring.datasource.username=root
spring.datasource.password=1234

#To create corresponding SQL stmts in DB
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
#Create a DB, columns automatic on running the application
spring.jpa.hibernate.ddl-auto=update

server.port=8083

eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/

logging.level.feign.Client=DEBUG
logging.level.org.springframework.cloud.openfeign.FeignClient=DEBUG

#for actuator refresh
management.endpoints.web.exposure.include=*
